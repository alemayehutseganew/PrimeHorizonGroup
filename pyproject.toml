[project]
name = "primehorizongroup"
version = "0.1.0"
description = "Prime Horizon Group Plc — Django REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==4.2.7",
  "djangorestframework==3.14.0",
  "djangorestframework-simplejwt==5.5.1",
  "django-cors-headers==4.3.1",
  "django-filter==23.3",
  "dj-database-url==3.0.1",
  "psycopg2-binary>=2.9.10",
  "whitenoise==6.6.0",
  "gunicorn==21.2.0",
]

[tool.vercel]
entrypoint = "main:app"
